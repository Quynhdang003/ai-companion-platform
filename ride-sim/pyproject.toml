[project]
name = "ride-sim"
version = "0.1.0"
description = "Standalone simulated ride provider over REST"
authors = [
    { name = "Quynhdang003", email = "quynhdang0378@gmail.com" }
]
requires-python = ">=3.11"
dependencies = [
    "aiosqlite>=0.21",
    "fastapi[standard]>=0.162.0",
    "httpx>=0.28.1",
    "pydantic-settings>=2.16.1",
    "sqlalchemy[asyncio]>=2.1.6",
]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.pytest.ini_options]
testpaths = ["tests"]
# Live tests call the public map servers (OSRM, Photon): run them with `pytest -m live`.
addopts = "-m 'not live'"
markers = ["live: calls a real map server over the network"]

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "ruff>=0.17.2",
]
