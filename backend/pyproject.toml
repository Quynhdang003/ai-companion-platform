[project]
name = "backend"
version = "0.1.0"
description = "AI Companion business API (hooks, tools, jobs)"
authors = [
    { name = "Quynhdang003", email = "quynhdang0378@gmail.com" }
]
requires-python = ">=3.11"
dependencies = [
    "alembic>=1.20.1",
    "apscheduler>=3.11.3",
    "asyncpg>=0.32.0",
    "fastapi[standard]>=0.162.0",
    "google-genai>=2.33.0",
    "httpx>=0.28.1",
    "pgvector>=0.5.1",
    "pydantic-settings>=2.16.1",
    "pyjwt[crypto]>=2.15.1",
    "sqlalchemy[asyncio]>=2.1.6",
    "svix>=2.9.0",
]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "pytest-asyncio>=1.4.1",
    "ruff>=0.17.2",
]
